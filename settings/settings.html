<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Docs Copy Extension - Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      padding: 40px 20px;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #1a73e8;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .section {
      margin-bottom: 32px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #333;
      border-bottom: 2px solid #1a73e8;
      padding-bottom: 8px;
    }

    .setting-group {
      margin-bottom: 24px;
    }

    .setting-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
    }

    .setting-description {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .save-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .save-btn:hover {
      background: #1557b0;
    }

    .save-btn:active {
      background: #0d47a1;
    }

    .status-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      display: none;
      font-size: 14px;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #1a73e8;
      padding: 16px;
      margin-top: 24px;
      border-radius: 4px;
    }

    .info-box h3 {
      font-size: 15px;
      margin-bottom: 8px;
      color: #1a73e8;
    }

    .info-box p {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    .info-box code {
      background: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Extension Settings</h1>
    <p class="subtitle">Configure your Google Docs Copy extension</p>

    <!-- Markdown Format Section -->
    <div class="section">
      <h2>Markdown Formatting</h2>

      <div class="setting-group">
        <label class="setting-label">Heading Style</label>
        <span class="setting-description">How headings should be formatted in markdown</span>
        <select id="headingStyle">
          <option value="atx">ATX Style (# Heading)</option>
          <option value="setext">Setext Style (Heading with underline)</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">Comment Format</label>
        <span class="setting-description">How comments should be displayed</span>
        <select id="commentFormat">
          <option value="blockquote">Blockquote Style (> Comment)</option>
          <option value="section">Separate Section at End</option>
          <option value="inline">Inline Annotations</option>
        </select>
      </div>

      <div class="setting-group checkbox-group">
        <input type="checkbox" id="includeResolvedComments">
        <label for="includeResolvedComments">Include resolved comments</label>
      </div>
    </div>

    <!-- Performance Section -->
    <div class="section">
      <h2>Performance</h2>

      <div class="setting-group">
        <label class="setting-label">Image Quality</label>
        <span class="setting-description">Use lower quality for faster copying with large images</span>
        <select id="imageQuality">
          <option value="original">Original Quality (Slower)</option>
          <option value="high">High Quality (Recommended)</option>
          <option value="medium">Medium Quality (Faster)</option>
        </select>
      </div>

      <div class="setting-group checkbox-group">
        <input type="checkbox" id="showProgress">
        <label for="showProgress">Show progress for large documents</label>
      </div>
    </div>

    <!-- Save Button -->
    <button class="save-btn" id="saveBtn">Save Settings</button>
    <div class="status-message" id="statusMessage"></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
