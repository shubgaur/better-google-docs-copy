<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="canvas16" width="16" height="16"></canvas>
<canvas id="canvas48" width="48" height="48"></canvas>
<canvas id="canvas128" width="128" height="128"></canvas>
<script>
function createIcon(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  
  // Blue background
  ctx.fillStyle = '#1a73e8';
  ctx.fillRect(0, 0, size, size);
  
  // White document icon
  ctx.fillStyle = '#ffffff';
  const margin = size * 0.2;
  const width = size * 0.6;
  const height = size * 0.7;
  ctx.fillRect(margin, margin, width, height);
  
  // Fold corner
  ctx.fillStyle = '#e8f0fe';
  ctx.beginPath();
  ctx.moveTo(margin + width, margin);
  ctx.lineTo(margin + width, margin + height * 0.3);
  ctx.lineTo(margin + width * 0.7, margin);
  ctx.fill();
}

createIcon('canvas16', 16);
createIcon('canvas48', 48);
createIcon('canvas128', 128);

console.log('Icons created! Right-click each canvas to save as PNG.');
</script>
</body>
</html>
